---
- name: Skip PowerDNS when install method is skip
  ansible.builtin.debug:
    msg: "PowerDNS install skipped by powerdns_install_method=skip"
  when: powerdns_install_method == "skip"

- name: Install native PowerDNS packages
  ansible.builtin.dnf:
    name: "{{ powerdns_packages }}"
    state: present
  when: powerdns_install_method == "native"

- name: Create PowerDNS database
  community.mysql.mysql_db:
    name: "{{ powerdns_db_name }}"
    state: present
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    login_unix_socket: "{{ powerdns_mysql_socket }}"
  when: powerdns_install_method != "skip"

- name: Create PowerDNS database user
  community.mysql.mysql_user:
    name: "{{ powerdns_db_user }}"
    password: "{{ powerdns_db_password }}"
    host: "127.0.0.1"
    priv: "{{ powerdns_db_name }}.*:ALL"
    state: present
    login_unix_socket: "{{ powerdns_mysql_socket }}"
  no_log: true
  when: powerdns_install_method != "skip"

- name: Check PowerDNS domains table
  community.mysql.mysql_query:
    login_unix_socket: "{{ powerdns_mysql_socket }}"
    login_db: "{{ powerdns_db_name }}"
    query: "SHOW TABLES LIKE 'domains'"
  register: powerdns_domains_table
  changed_when: false
  when: powerdns_install_method != "skip"

- name: Locate PowerDNS MySQL schema
  ansible.builtin.shell: |
    set -o pipefail
    rpm -ql pdns-backend-mysql | grep '/schema.mysql.sql$' | head -n 1
  args:
    executable: /bin/bash
  register: powerdns_mysql_schema
  changed_when: false
  when:
    - powerdns_install_method != "skip"
    - powerdns_domains_table.query_result[0] | length == 0

- name: Fail when PowerDNS MySQL schema is not available
  ansible.builtin.fail:
    msg: "PowerDNS MySQL schema was not found in pdns-backend-mysql package."
  when:
    - powerdns_install_method != "skip"
    - powerdns_domains_table.query_result[0] | length == 0
    - powerdns_mysql_schema.stdout | length == 0

- name: Import PowerDNS MySQL schema
  community.mysql.mysql_db:
    name: "{{ powerdns_db_name }}"
    state: import
    target: "{{ powerdns_mysql_schema.stdout }}"
    login_unix_socket: "{{ powerdns_mysql_socket }}"
  when:
    - powerdns_install_method != "skip"
    - powerdns_domains_table.query_result[0] | length == 0

- name: Configure PowerDNS authoritative server
  ansible.builtin.template:
    src: pdns.conf.j2
    dest: /etc/pdns/pdns.conf
    owner: root
    group: pdns
    mode: "0640"
  notify: restart pdns
  when: powerdns_install_method != "skip"

- name: Enable and start PowerDNS
  ansible.builtin.systemd:
    name: pdns
    enabled: true
    state: started
  when:
    - powerdns_install_method != "skip"
    - not ansible_check_mode

- name: Wait for PowerDNS API
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ powerdns_api_port }}"
    timeout: 30
  when:
    - powerdns_install_method != "skip"
    - not ansible_check_mode

- name: Check PowerDNS service responds
  ansible.builtin.command: "pdnsutil list-all-zones"
  register: powerdns_zones
  changed_when: false
  when:
    - powerdns_install_method != "skip"
    - not ansible_check_mode

- name: Show PowerDNS status
  ansible.builtin.debug:
    msg: "{{ powerdns_zones.stdout | default('PowerDNS check skipped in check mode') }}"
  when: powerdns_install_method != "skip"
