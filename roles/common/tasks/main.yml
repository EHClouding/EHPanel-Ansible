---
# roles/common/tasks/main.yml
# Orden importa: usuarios deben existir antes que sus directorios.

- name: Install base packages
  ansible.builtin.import_tasks: packages.yml
  tags: [common-packages]

- name: Configure timezone
  ansible.builtin.import_tasks: timezone.yml
  tags: [common-timezone]

- name: Configure NTP (chrony)
  ansible.builtin.import_tasks: ntp.yml
  tags: [common-ntp]

- name: Configure hostname
  ansible.builtin.import_tasks: hostname.yml
  tags: [common-hostname]
  when: common_hostname is defined

- name: Create system users
  ansible.builtin.import_tasks: users.yml
  tags: [common-users]

- name: Configure sysctl
  ansible.builtin.import_tasks: sysctl.yml
  tags: [common-sysctl]

- name: Configure system limits
  ansible.builtin.import_tasks: limits.yml
  tags: [common-limits]

- name: Create EHPanel base directories
  ansible.builtin.import_tasks: dirs.yml
  tags: [common-dirs]
