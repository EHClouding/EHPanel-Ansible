---
# roles/common/defaults/main.yml

# ── Timezone ──────────────────────────────────────────────────────────────────
common_timezone: "America/La_Paz"

# ── Hostname ──────────────────────────────────────────────────────────────────
# common_hostname: ""   # Sobrescribir en host_vars/<host>/vars.yml

# ── NTP ───────────────────────────────────────────────────────────────────────
common_ntp_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org

# ── Paquetes base ─────────────────────────────────────────────────────────────
common_packages:
  - curl
  - wget
  - git
  - rsync
  - jq
  - python3
  - python3-pip
  - chrony
  - bind-utils
  - net-tools
  - lsof
  - unzip
  - tar
  - vim
  - bash-completion
  - dnf-plugins-core
  - epel-release
  - acl
  - policycoreutils-python-utils

# ── Usuarios del sistema ──────────────────────────────────────────────────────
common_system_users:
  - name: ehpanel
    shell: /sbin/nologin
    home: /opt/ehpanel
    system: true

# ── Directorios base ──────────────────────────────────────────────────────────
common_dirs:
  - path: /opt/ehpanel
    owner: ehpanel
    group: ehpanel
    mode: "0750"
  - path: /etc/ehpanel
    owner: root
    group: ehpanel
    mode: "0750"
  - path: /var/log/ehpanel
    owner: ehpanel
    group: ehpanel
    mode: "0750"

# ── Sysctl ────────────────────────────────────────────────────────────────────
common_sysctl:
  net.core.somaxconn: 65535
  vm.swappiness: 10
  fs.file-max: 1000000
  net.ipv4.tcp_fin_timeout: 30
  net.ipv4.tcp_keepalive_time: 300
  net.ipv4.tcp_max_syn_backlog: 4096
  net.ipv4.ip_local_port_range: "1024 65535"

# ── Límites del sistema ───────────────────────────────────────────────────────
# Estos límites se aplican al usuario/servicio ehpanel y a procesos genéricos.
common_limits:
  - domain: ehpanel
    type: soft
    item: nofile
    value: "65536"
  - domain: ehpanel
    type: hard
    item: nofile
    value: "65536"
  - domain: ehpanel
    type: soft
    item: nproc
    value: "4096"
  - domain: ehpanel
    type: hard
    item: nproc
    value: "4096"
  - domain: "*"
    type: soft
    item: nofile
    value: "65536"
  - domain: "*"
    type: hard
    item: nofile
    value: "65536"
