---
- name: Ensure database admin tools directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/ehpanel, mode: "0711" }
    - { path: "{{ db_admin_tools_root }}", mode: "0755" }
    - { path: "{{ db_admin_tools_config_dir }}", owner: root, group: apache, mode: "0750" }
    - { path: "{{ phpmyadmin_install_dir }}", mode: "0755" }
    - { path: /var/lib/phpmyadmin/tmp, owner: apache, group: apache, mode: "0750" }
  when: db_admin_tools_enabled | bool

- name: Install phpMyAdmin archive
  ansible.builtin.unarchive:
    src: "{{ phpmyadmin_download_url }}"
    dest: "{{ phpmyadmin_install_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    owner: root
    group: root
    mode: "0755"
    creates: "{{ phpmyadmin_install_dir }}/index.php"
  when:
    - db_admin_tools_enabled | bool
    - phpmyadmin_enabled | bool

- name: Check phpMyAdmin blowfish secret
  ansible.builtin.stat:
    path: "{{ phpmyadmin_blowfish_secret_file }}"
  register: phpmyadmin_secret
  when:
    - db_admin_tools_enabled | bool
    - phpmyadmin_enabled | bool

- name: Generate phpMyAdmin blowfish secret
  ansible.builtin.command: openssl rand -base64 32
  register: phpmyadmin_secret_generated
  changed_when: true
  no_log: true
  when:
    - db_admin_tools_enabled | bool
    - phpmyadmin_enabled | bool
    - not phpmyadmin_secret.stat.exists

- name: Store phpMyAdmin blowfish secret
  ansible.builtin.copy:
    dest: "{{ phpmyadmin_blowfish_secret_file }}"
    content: "{{ phpmyadmin_secret_generated.stdout }}\n"
    owner: root
    group: apache
    mode: "0640"
  no_log: true
  when:
    - db_admin_tools_enabled | bool
    - phpmyadmin_enabled | bool
    - not phpmyadmin_secret.stat.exists

- name: Read phpMyAdmin blowfish secret
  ansible.builtin.slurp:
    path: "{{ phpmyadmin_blowfish_secret_file }}"
  register: phpmyadmin_secret_slurp
  no_log: true
  when:
    - db_admin_tools_enabled | bool
    - phpmyadmin_enabled | bool

- name: Configure phpMyAdmin
  ansible.builtin.template:
    src: phpmyadmin.config.inc.php.j2
    dest: "{{ phpmyadmin_install_dir }}/config.inc.php"
    owner: root
    group: apache
    mode: "0640"
  vars:
    phpmyadmin_blowfish_secret: "{{ phpmyadmin_secret_slurp.content | b64decode | trim }}"
  no_log: true
  when:
    - db_admin_tools_enabled | bool
    - phpmyadmin_enabled | bool

- name: Install Adminer
  ansible.builtin.get_url:
    url: "{{ adminer_download_url }}"
    dest: "{{ adminer_install_path }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - db_admin_tools_enabled | bool
    - adminer_enabled | bool

- name: Install EHPanel database SSO bridge
  ansible.builtin.template:
    src: sso.php.j2
    dest: "{{ db_admin_tools_root }}/sso.php"
    owner: root
    group: root
    mode: "0644"
  when: db_admin_tools_enabled | bool

- name: Store EHPanel database SSO secret for PHP bridge
  ansible.builtin.copy:
    dest: "{{ db_admin_tools_sso_secret_file }}"
    content: "{{ db_admin_tools_sso_secret }}\n"
    owner: root
    group: apache
    mode: "0640"
  no_log: true
  when:
    - db_admin_tools_enabled | bool
    - db_admin_tools_sso_secret | length > 0

- name: Store EHPanel panel base URL for database SSO bridge
  ansible.builtin.copy:
    dest: "{{ db_admin_tools_panel_base_url_file }}"
    content: "{{ db_admin_tools_panel_base_url | default(ehpanel_web_panel_public_url | default('', true), true) }}\n"
    owner: root
    group: apache
    mode: "0640"
  when:
    - db_admin_tools_enabled | bool
    - (db_admin_tools_panel_base_url | default(ehpanel_web_panel_public_url | default('', true), true)) | length > 0

- name: Link database admin tools into Apache document root
  ansible.builtin.file:
    src: "{{ db_admin_tools_root }}"
    dest: "{{ db_admin_tools_web_path }}"
    state: link
    force: true
  when: db_admin_tools_enabled | bool

- name: Configure Apache aliases for database admin tools
  ansible.builtin.template:
    src: db-admin-tools-apache.conf.j2
    dest: /etc/httpd/conf.d/30-ehpanel-db-admin-tools.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload httpd
  when: db_admin_tools_enabled | bool

- name: Show database admin tool URLs
  ansible.builtin.debug:
    msg:
      - "phpMyAdmin: /ehpanel-dbtools/phpmyadmin/"
      - "Adminer: /ehpanel-dbtools/adminer.php"
  when: db_admin_tools_enabled | bool
