---
- name: Install native MariaDB packages
  ansible.builtin.dnf:
    name: "{{ mariadb_packages }}"
    state: present
  when: mariadb_install_strategy == "native"

- name: Configure EHPanel MariaDB server settings
  ansible.builtin.template:
    src: ehpanel-server.cnf.j2
    dest: /etc/my.cnf.d/ehpanel-server.cnf
    owner: root
    group: root
    mode: "0644"
  notify: restart mariadb

- name: Ensure MariaDB backup directory exists
  ansible.builtin.file:
    path: "{{ mariadb_backup_dir }}"
    owner: root
    group: root
    mode: "0750"
    state: directory

- name: Ensure MariaDB log directory exists
  ansible.builtin.file:
    path: /var/log/mariadb
    owner: mysql
    group: mysql
    mode: "0750"
    state: directory

- name: Enable and start MariaDB
  ansible.builtin.systemd:
    name: mariadb
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Wait for MariaDB local socket
  ansible.builtin.wait_for:
    path: /var/lib/mysql/mysql.sock
    timeout: 30
  when: not ansible_check_mode

- name: Check MariaDB responds locally
  ansible.builtin.command: mysqladmin ping
  register: mariadb_ping
  changed_when: false
  when: not ansible_check_mode

- name: Show MariaDB status
  ansible.builtin.debug:
    msg: "{{ mariadb_ping.stdout | default('MariaDB check skipped in check mode') }}"
