---
- name: Ensure EHPanel Webmail packages
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
      - python3-virtualenv
      - gcc
      - python3-devel
    state: present

- name: Ensure EHPanel Webmail group
  ansible.builtin.group:
    name: "{{ ehpanel_webmail_group }}"
    system: true

- name: Ensure EHPanel Webmail user
  ansible.builtin.user:
    name: "{{ ehpanel_webmail_user }}"
    group: "{{ ehpanel_webmail_group }}"
    home: "{{ ehpanel_webmail_root }}"
    shell: /bin/bash
    system: true
    create_home: false

- name: Ensure EHPanel Webmail directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ ehpanel_webmail_root }}", owner: "{{ ehpanel_webmail_user }}", group: "{{ ehpanel_webmail_group }}", mode: "0755" }
    - { path: "{{ ehpanel_webmail_env_dir }}", owner: root, group: "{{ ehpanel_webmail_group }}", mode: "0750" }
    - { path: "/var/lib/ehpanel-webmail", owner: "{{ ehpanel_webmail_user }}", group: "{{ ehpanel_webmail_group }}", mode: "0750" }
    - { path: "{{ ehpanel_webmail_drive_root }}", owner: "{{ ehpanel_webmail_user }}", group: "{{ ehpanel_webmail_group }}", mode: "0750" }
    - { path: "{{ ehpanel_webmail_compose_upload_root }}", owner: "{{ ehpanel_webmail_user }}", group: "{{ ehpanel_webmail_group }}", mode: "0750" }
    - { path: "/var/log/ehpanel-webmail", owner: "{{ ehpanel_webmail_user }}", group: "{{ ehpanel_webmail_group }}", mode: "0750" }

- name: Copy EHPanel Webmail source when provided
  ansible.builtin.copy:
    src: "{{ ehpanel_webmail_source_path }}/"
    dest: "{{ ehpanel_webmail_root }}/"
    owner: "{{ ehpanel_webmail_user }}"
    group: "{{ ehpanel_webmail_group }}"
    mode: preserve
  when: ehpanel_webmail_source_path | length > 0
  notify: Restart ehpanel webmail

- name: Render EHPanel Webmail environment
  ansible.builtin.template:
    src: webmail.env.j2
    dest: "{{ ehpanel_webmail_env_file }}"
    owner: root
    group: "{{ ehpanel_webmail_group }}"
    mode: "0640"
  notify: Restart ehpanel webmail

- name: Copy EHPanel Webmail environment for Django management commands
  ansible.builtin.copy:
    src: "{{ ehpanel_webmail_env_file }}"
    dest: "{{ ehpanel_webmail_root }}/backend/.env"
    owner: "{{ ehpanel_webmail_user }}"
    group: "{{ ehpanel_webmail_group }}"
    mode: "0640"
    remote_src: true
  when: ehpanel_webmail_source_path | length > 0
  notify: Restart ehpanel webmail

- name: Create EHPanel Webmail Python virtualenv
  ansible.builtin.command:
    cmd: "python3 -m venv {{ ehpanel_webmail_venv }}"
    creates: "{{ ehpanel_webmail_venv }}/bin/python"
  become_user: "{{ ehpanel_webmail_user }}"

- name: Install EHPanel Webmail Python dependencies
  ansible.builtin.pip:
    requirements: "{{ ehpanel_webmail_root }}/backend/requirements.txt"
    virtualenv: "{{ ehpanel_webmail_venv }}"
  become_user: "{{ ehpanel_webmail_user }}"
  when: ehpanel_webmail_source_path | length > 0
  notify: Restart ehpanel webmail

- name: Install EHPanel Webmail frontend dependencies
  ansible.builtin.shell:
    cmd: |
      if [ -f pnpm-lock.yaml ]; then
        {{ ehpanel_webmail_pnpm_bin }} --config.manage-package-manager-versions=false install --frozen-lockfile
      else
        {{ ehpanel_webmail_pnpm_bin }} --config.manage-package-manager-versions=false install --no-frozen-lockfile
      fi
    chdir: "{{ ehpanel_webmail_root }}/frontend"
  become_user: "{{ ehpanel_webmail_user }}"
  environment:
    CI: "true"
  when: ehpanel_webmail_source_path | length > 0
  changed_when: true

- name: Build EHPanel Webmail frontend
  ansible.builtin.command:
    cmd: "{{ ehpanel_webmail_pnpm_bin }} --config.manage-package-manager-versions=false build"
    chdir: "{{ ehpanel_webmail_root }}/frontend"
  become_user: "{{ ehpanel_webmail_user }}"
  environment:
    CI: "true"
  when: ehpanel_webmail_source_path | length > 0
  changed_when: true

- name: Protect EHPanel Webmail backend
  ansible.builtin.file:
    path: "{{ ehpanel_webmail_root }}/backend"
    owner: "{{ ehpanel_webmail_user }}"
    group: "{{ ehpanel_webmail_group }}"
    mode: "0750"
    state: directory
  when: ehpanel_webmail_source_path | length > 0

- name: Allow Nginx to read EHPanel Webmail frontend build
  ansible.builtin.file:
    path: "{{ ehpanel_webmail_root }}/frontend/dist"
    owner: "{{ ehpanel_webmail_user }}"
    group: "{{ ehpanel_webmail_group }}"
    mode: "0755"
    state: directory
    recurse: true
  when: ehpanel_webmail_source_path | length > 0

- name: Run EHPanel Webmail migrations
  ansible.builtin.command:
    cmd: "{{ ehpanel_webmail_venv }}/bin/python manage.py migrate --noinput"
    chdir: "{{ ehpanel_webmail_root }}/backend"
  become_user: "{{ ehpanel_webmail_user }}"
  environment:
    ENV_FILE: "{{ ehpanel_webmail_env_file }}"
  when: ehpanel_webmail_source_path | length > 0
  changed_when: true

- name: Render EHPanel Webmail systemd service
  ansible.builtin.template:
    src: ehpanel-webmail.service.j2
    dest: "/etc/systemd/system/{{ ehpanel_webmail_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart ehpanel webmail

- name: Enable EHPanel Webmail service
  ansible.builtin.systemd:
    name: "{{ ehpanel_webmail_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when: ehpanel_webmail_source_path | length > 0
