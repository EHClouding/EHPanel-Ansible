---
- name: Install security baseline packages
  ansible.builtin.dnf:
    name: "{{ security_packages }}"
    state: present

- name: Remove insecure legacy packages
  ansible.builtin.dnf:
    name: "{{ security_packages_remove }}"
    state: absent

- name: Configure SELinux state
  ansible.posix.selinux:
    policy: "{{ security_selinux_policy }}"
    state: "{{ security_selinux_state }}"
  register: security_selinux_result
  when: not ansible_check_mode

- name: Ensure SSH drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure SSH hardening drop-in
  ansible.builtin.template:
    src: ehpanel-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-ehpanel-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: restart sshd

- name: Validate complete SSH daemon configuration
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Enable and start SSH daemon
  ansible.builtin.systemd:
    name: sshd
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Configure fail2ban sshd jail
  ansible.builtin.template:
    src: ehpanel-sshd.local.j2
    dest: /etc/fail2ban/jail.d/ehpanel-sshd.local
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Configure audit rules
  ansible.builtin.template:
    src: ehpanel.rules.j2
    dest: /etc/audit/rules.d/ehpanel.rules
    owner: root
    group: root
    mode: "0600"
  notify: reload audit rules

- name: Enable and start auditd
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: false
  when: not ansible_check_mode

- name: Show security baseline status
  ansible.builtin.debug:
    msg:
      - "SELinux target state: {{ security_selinux_state }}"
      - "SSH port: {{ security_ssh_port }}"
      - "SSH PermitRootLogin: {{ security_ssh_permit_root_login }}"
      - "SSH PasswordAuthentication: {{ security_ssh_password_auth }}"
      - "Fail2ban maxretry: {{ security_fail2ban_maxretry }}"
