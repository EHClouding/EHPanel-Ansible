---
php_versions:
  - "8.2"
  - "8.3"

node_services_enabled:
  - nginx
  - httpd
  - lshttpd
  - mariadb
  - postgresql
  - valkey
  - pdns
  - postfix
  - dovecot
  - rspamd
  - vsftpd
  - ehpanel-web
  - ehagent-web

firewall_additional_ports:
  - "21/tcp"
  - "30000-30100/tcp"

apache_listen_addr: "127.0.0.1"
apache_listen_port: 8080

certbot_staging: false
certbot_email: "admin@theflakito.com"
certbot_domains:
  - domain: "web-01.theflakito.com"
    aliases: []

ehagent_privileged_mode: true
